<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Formulario de registro</h2>
        <p class="subtitle">Completa la información para crear una cuenta nueva.</p>
        
        <form>
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Nombre y apellidos" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" placeholder="Tu usuario" required>
            </div>

            <div class="form-group">
                <label for="genero">Género favorito</label>
                <select id="genero" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="accion">Acción</option>
                    <option value="comedia">Comedia</option>
                    <option value="drama">Drama</option>
                    <option value="ciencia-ficcion">Ciencia Ficción</option>
                </select>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Crea una contraseña" required>
            </div>

            <button type="submit" class="btn-submit">Registrarme</button>
        </form>
    </div>

</body>
</html>
